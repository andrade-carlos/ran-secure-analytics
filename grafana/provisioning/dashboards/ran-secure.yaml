# RAN-Secure dashboards (generated by grafana/generate_dashboards.py).
# Loaded into the "RAN-Secure" folder on every Grafana start and re-read every 60 s.
apiVersion: 1
providers:
  - name: ran-secure
    orgId: 1
    folder: RAN-Secure
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/provisioning/dashboards/ran-secure
