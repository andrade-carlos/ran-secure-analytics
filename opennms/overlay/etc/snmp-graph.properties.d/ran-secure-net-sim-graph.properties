##############################################################################
##
##  RAN-Secure Analytics Platform - graphs for the simulated transport and
##  access network (RAN-SECURE-NET-SIM-MIB, IF-MIB, BRIDGE-MIB)
##  Data collection: datacollection/ran-secure-net-sim.xml
##
##  Optical power values are collected in 0.01 dBm and divided by 100 here.
##
##############################################################################

reports=rsnet.chassis.cpumem, \
rsnet.chassis.temp, \
rsnet.lsp.util, \
rsnet.lsp.latency, \
rsnet.lsp.path, \
rsnet.bgp.prefixes, \
rsnet.bgp.state, \
rsnet.opt.linepower, \
rsnet.opt.chpower, \
rsnet.opt.osnr, \
rsnet.opt.ber, \
rsnet.pon.onus, \
rsnet.pon.rxpower, \
rsnet.pon.util, \
rsnet.sw.macs, \
rsnet.sw.stp, \
rsnet.if.bcast, \
rsnet.if.errors

######
###### Chassis (all transport / access elements)
######

report.rsnet.chassis.cpumem.name=Chassis CPU and Memory
report.rsnet.chassis.cpumem.columns=rsChassisCpuLoad,rsChassisMemUtil
report.rsnet.chassis.cpumem.type=nodeSnmp
report.rsnet.chassis.cpumem.command=--title="Control Plane CPU and Memory" \
 --vertical-label="Percent" \
 --lower-limit 0 --upper-limit 100 --rigid \
 DEF:cpu={rrd1}:rsChassisCpuLoad:AVERAGE \
 DEF:mem={rrd2}:rsChassisMemUtil:AVERAGE \
 LINE2:cpu#4E79A7:"CPU   " \
 GPRINT:cpu:AVERAGE:"Avg  \\: %5.1lf %%" \
 GPRINT:cpu:MAX:"Max  \\: %5.1lf %%\\n" \
 LINE2:mem#F28E2B:"Memory" \
 GPRINT:mem:AVERAGE:"Avg  \\: %5.1lf %%" \
 GPRINT:mem:MAX:"Max  \\: %5.1lf %%\\n"

report.rsnet.chassis.temp.name=Chassis Temperature
report.rsnet.chassis.temp.columns=rsChassisTemp
report.rsnet.chassis.temp.type=nodeSnmp
report.rsnet.chassis.temp.command=--title="Main Board Temperature" \
 --vertical-label="Degrees C" \
 DEF:temp={rrd1}:rsChassisTemp:AVERAGE \
 LINE2:temp#E15759:"Temperature" \
 GPRINT:temp:AVERAGE:"Avg  \\: %5.1lf C" \
 GPRINT:temp:MAX:"Max  \\: %5.1lf C\\n"

######
###### IP/MPLS: LSPs and BGP
######

report.rsnet.lsp.util.name=MPLS LSP Bandwidth Utilization
report.rsnet.lsp.util.columns=rsLspBwUtil
report.rsnet.lsp.util.type=rsLspEntry
report.rsnet.lsp.util.command=--title="LSP Utilization - {rsLspName}" \
 --vertical-label="Percent of reserved bandwidth" \
 --lower-limit 0 --upper-limit 100 --rigid \
 DEF:util={rrd1}:rsLspBwUtil:AVERAGE \
 AREA:util#76B7B2:"Utilization" \
 GPRINT:util:AVERAGE:"Avg  \\: %5.1lf %%" \
 GPRINT:util:MAX:"Max  \\: %5.1lf %%\\n" \
 HRULE:85#E15759:"Re-optimization threshold (85 pct)\\n"

report.rsnet.lsp.latency.name=MPLS LSP Latency
report.rsnet.lsp.latency.columns=rsLspLatency
report.rsnet.lsp.latency.type=rsLspEntry
report.rsnet.lsp.latency.command=--title="LSP One-way Latency - {rsLspName}" \
 --vertical-label="Milliseconds" \
 DEF:us={rrd1}:rsLspLatency:AVERAGE \
 CDEF:ms=us,1000,/ \
 LINE2:ms#4E79A7:"Latency" \
 GPRINT:ms:AVERAGE:"Avg  \\: %6.3lf ms" \
 GPRINT:ms:MAX:"Max  \\: %6.3lf ms\\n"

report.rsnet.lsp.path.name=MPLS LSP Active Path
report.rsnet.lsp.path.columns=rsLspActivePath,rsLspOperStatus
report.rsnet.lsp.path.type=rsLspEntry
report.rsnet.lsp.path.command=--title="LSP Active Path - {rsLspName}" \
 --vertical-label="1 = primary, 2 = secondary" \
 --lower-limit 0 --upper-limit 2.5 --rigid \
 DEF:path={rrd1}:rsLspActivePath:AVERAGE \
 DEF:oper={rrd2}:rsLspOperStatus:AVERAGE \
 LINE2:path#F28E2B:"Active path (1 primary, 2 secondary)" \
 GPRINT:path:MAX:"Max  \\: %3.0lf\\n" \
 LINE1:oper#59A14F:"Oper status (1 up, 2 down)\\n"

report.rsnet.bgp.prefixes.name=BGP Prefixes Received
report.rsnet.bgp.prefixes.columns=rsBgpPfxRx
report.rsnet.bgp.prefixes.type=rsBgpPeerEntry
report.rsnet.bgp.prefixes.command=--title="BGP Prefixes Received - {rsBgpPeerName}" \
 --vertical-label="Prefixes" \
 --lower-limit 0 \
 DEF:pfx={rrd1}:rsBgpPfxRx:AVERAGE \
 AREA:pfx#59A14F:"Accepted prefixes" \
 GPRINT:pfx:MIN:"Min  \\: %8.0lf" \
 GPRINT:pfx:MAX:"Max  \\: %8.0lf\\n"

report.rsnet.bgp.state.name=BGP Session State
report.rsnet.bgp.state.columns=rsBgpPeerState
report.rsnet.bgp.state.type=rsBgpPeerEntry
report.rsnet.bgp.state.command=--title="BGP Session State - {rsBgpPeerName}" \
 --vertical-label="FSM state (6 = established)" \
 --lower-limit 0 --upper-limit 6.5 --rigid \
 DEF:state={rrd1}:rsBgpPeerState:AVERAGE \
 LINE2:state#4E79A7:"State" \
 GPRINT:state:MIN:"Min  \\: %3.0lf\\n" \
 HRULE:6#59A14F:"Established\\n"

######
###### DWDM optical layer
######

report.rsnet.opt.linepower.name=DWDM Line Optical Power
report.rsnet.opt.linepower.columns=rsOptRxPower,rsOptTxPower,rsOptChannels
report.rsnet.opt.linepower.type=rsOptPortEntry
report.rsnet.opt.linepower.command=--title="Line Optical Power - {rsOptPortName}" \
 --vertical-label="dBm" \
 DEF:rxraw={rrd1}:rsOptRxPower:AVERAGE \
 DEF:txraw={rrd2}:rsOptTxPower:AVERAGE \
 DEF:ch={rrd3}:rsOptChannels:AVERAGE \
 CDEF:rx=rxraw,100,/ \
 CDEF:tx=txraw,100,/ \
 LINE2:rx#4E79A7:"Rx power" \
 GPRINT:rx:AVERAGE:"Avg  \\: %6.2lf dBm" \
 GPRINT:rx:MIN:"Min  \\: %6.2lf dBm\\n" \
 LINE2:tx#F28E2B:"Tx power" \
 GPRINT:tx:AVERAGE:"Avg  \\: %6.2lf dBm\\n" \
 GPRINT:ch:LAST:"Wavelengths on the span\\: %2.0lf\\n" \
 HRULE:-30#E15759:"Loss of signal (-30 dBm)\\n"

report.rsnet.opt.chpower.name=DWDM Channel Optical Power
report.rsnet.opt.chpower.columns=rsOptRxPower,rsOptTxPower,rsOptOsnr
report.rsnet.opt.chpower.type=rsOptPortEntry
report.rsnet.opt.chpower.command=--title="Channel Optical Power - {rsOptPortName}" \
 --vertical-label="dBm" \
 DEF:rxraw={rrd1}:rsOptRxPower:AVERAGE \
 DEF:txraw={rrd2}:rsOptTxPower:AVERAGE \
 CDEF:rx=rxraw,100,/ \
 CDEF:tx=txraw,100,/ \
 LINE2:rx#4E79A7:"Client Rx" \
 GPRINT:rx:AVERAGE:"Avg  \\: %6.2lf dBm" \
 GPRINT:rx:MIN:"Min  \\: %6.2lf dBm\\n" \
 LINE2:tx#F28E2B:"Client Tx" \
 GPRINT:tx:AVERAGE:"Avg  \\: %6.2lf dBm\\n"

report.rsnet.opt.osnr.name=DWDM Channel OSNR
report.rsnet.opt.osnr.columns=rsOptOsnr
report.rsnet.opt.osnr.type=rsOptPortEntry
report.rsnet.opt.osnr.command=--title="OSNR - {rsOptPortName}" \
 --vertical-label="dB" \
 --lower-limit 0 \
 DEF:raw={rrd1}:rsOptOsnr:AVERAGE \
 CDEF:osnr=raw,100,/ \
 LINE2:osnr#59A14F:"OSNR" \
 GPRINT:osnr:AVERAGE:"Avg  \\: %5.2lf dB" \
 GPRINT:osnr:MIN:"Min  \\: %5.2lf dB\\n" \
 HRULE:15#E15759:"Minimum margin (15 dB)\\n"

report.rsnet.opt.ber.name=DWDM Channel Pre-FEC BER
report.rsnet.opt.ber.columns=rsOptPreFecBer
report.rsnet.opt.ber.type=rsOptPortEntry
report.rsnet.opt.ber.command=--title="Pre-FEC Bit Error Ratio - {rsOptPortName}" \
 --vertical-label="BER" \
 --logarithmic --units=si \
 DEF:raw={rrd1}:rsOptPreFecBer:AVERAGE \
 CDEF:ber=raw,1000000000,/ \
 LINE2:ber#B07AA1:"Pre-FEC BER" \
 GPRINT:ber:AVERAGE:"Avg  \\: %6.2le" \
 GPRINT:ber:MAX:"Max  \\: %6.2le\\n" \
 HRULE:0.0038#E15759:"HD-FEC limit (3.8E-3)\\n"

######
###### GPON / FTTH
######

report.rsnet.pon.onus.name=GPON ONUs Online
report.rsnet.pon.onus.columns=rsPonOnusReg,rsPonOnusOnline
report.rsnet.pon.onus.type=rsPonPortEntry
report.rsnet.pon.onus.command=--title="ONUs Online - {rsPonPortName}" \
 --vertical-label="ONUs" \
 --lower-limit 0 \
 DEF:reg={rrd1}:rsPonOnusReg:AVERAGE \
 DEF:on={rrd2}:rsPonOnusOnline:AVERAGE \
 AREA:on#59A14F:"Online    " \
 GPRINT:on:AVERAGE:"Avg  \\: %4.0lf" \
 GPRINT:on:MIN:"Min  \\: %4.0lf\\n" \
 LINE2:reg#4E79A7:"Registered" \
 GPRINT:reg:LAST:"Now  \\: %4.0lf\\n"

report.rsnet.pon.rxpower.name=GPON ONU Receive Power
report.rsnet.pon.rxpower.columns=rsPonRxAvg,rsPonRxWorst,rsPonOltTx
report.rsnet.pon.rxpower.type=rsPonPortEntry
report.rsnet.pon.rxpower.command=--title="ONU Receive Power - {rsPonPortName}" \
 --vertical-label="dBm" \
 DEF:avgraw={rrd1}:rsPonRxAvg:AVERAGE \
 DEF:worstraw={rrd2}:rsPonRxWorst:AVERAGE \
 DEF:txraw={rrd3}:rsPonOltTx:AVERAGE \
 CDEF:avg=avgraw,100,/ \
 CDEF:worst=worstraw,100,/ \
 CDEF:tx=txraw,100,/ \
 LINE2:avg#4E79A7:"Average ONU Rx" \
 GPRINT:avg:AVERAGE:"Avg  \\: %6.2lf dBm\\n" \
 LINE2:worst#F28E2B:"Worst ONU Rx  " \
 GPRINT:worst:AVERAGE:"Avg  \\: %6.2lf dBm" \
 GPRINT:worst:MIN:"Min  \\: %6.2lf dBm\\n" \
 GPRINT:tx:AVERAGE:"OLT Tx power\\: %5.2lf dBm\\n" \
 HRULE:-27#E15759:"Alarm threshold (-27 dBm)" \
 HRULE:-28#B07AA1:"Class B+ sensitivity (-28 dBm)\\n"

report.rsnet.pon.util.name=GPON Port Utilization
report.rsnet.pon.util.columns=rsPonDlUtil,rsPonUlUtil
report.rsnet.pon.util.type=rsPonPortEntry
report.rsnet.pon.util.command=--title="PON Utilization - {rsPonPortName}" \
 --vertical-label="Percent" \
 --lower-limit 0 --upper-limit 100 --rigid \
 DEF:dl={rrd1}:rsPonDlUtil:AVERAGE \
 DEF:ul={rrd2}:rsPonUlUtil:AVERAGE \
 LINE2:dl#4E79A7:"Downstream (2.488 Gbit/s)" \
 GPRINT:dl:AVERAGE:"Avg  \\: %5.1lf %%" \
 GPRINT:dl:MAX:"Max  \\: %5.1lf %%\\n" \
 LINE2:ul#F28E2B:"Upstream (1.244 Gbit/s)  " \
 GPRINT:ul:AVERAGE:"Avg  \\: %5.1lf %%" \
 GPRINT:ul:MAX:"Max  \\: %5.1lf %%\\n" \
 HRULE:70#E15759:"Capacity planning threshold (70 pct)\\n"

######
###### Ethernet switches
######

report.rsnet.sw.macs.name=Switch MAC Table Size
report.rsnet.sw.macs.columns=rsSwMacEntries
report.rsnet.sw.macs.type=nodeSnmp
report.rsnet.sw.macs.command=--title="Learned MAC Addresses" \
 --vertical-label="Entries" \
 --lower-limit 0 \
 DEF:macs={rrd1}:rsSwMacEntries:AVERAGE \
 AREA:macs#76B7B2:"MAC entries" \
 GPRINT:macs:AVERAGE:"Avg  \\: %6.0lf" \
 GPRINT:macs:MAX:"Max  \\: %6.0lf\\n"

report.rsnet.sw.stp.name=Switch STP Topology Changes
report.rsnet.sw.stp.columns=dot1dStpTopChanges
report.rsnet.sw.stp.type=nodeSnmp
report.rsnet.sw.stp.command=--title="Spanning Tree Topology Changes" \
 --vertical-label="Changes per hour" \
 --lower-limit 0 \
 DEF:rate={rrd1}:dot1dStpTopChanges:AVERAGE \
 CDEF:perhour=rate,3600,* \
 AREA:perhour#E15759:"Topology changes" \
 GPRINT:perhour:AVERAGE:"Avg  \\: %6.1lf /h" \
 GPRINT:perhour:MAX:"Max  \\: %6.1lf /h\\n"

report.rsnet.if.bcast.name=Broadcast and Multicast Packets
report.rsnet.if.bcast.columns=rsIfInBcastPkts,rsIfInMcastPkts
report.rsnet.if.bcast.type=interfaceSnmp
report.rsnet.if.bcast.command=--title="Inbound Broadcast and Multicast" \
 --vertical-label="Packets per second" \
 --lower-limit 0 \
 DEF:bc={rrd1}:rsIfInBcastPkts:AVERAGE \
 DEF:mc={rrd2}:rsIfInMcastPkts:AVERAGE \
 LINE2:bc#E15759:"Broadcast" \
 GPRINT:bc:AVERAGE:"Avg  \\: %8.1lf pps" \
 GPRINT:bc:MAX:"Max  \\: %8.1lf pps\\n" \
 LINE2:mc#4E79A7:"Multicast" \
 GPRINT:mc:AVERAGE:"Avg  \\: %8.1lf pps\\n" \
 HRULE:1000#B07AA1:"Storm-control threshold (1000 pps)\\n"

report.rsnet.if.errors.name=Interface Input Errors
report.rsnet.if.errors.columns=rsIfInErrors
report.rsnet.if.errors.type=interfaceSnmp
report.rsnet.if.errors.command=--title="Input Errors (CRC / frame)" \
 --vertical-label="Errors per second" \
 --lower-limit 0 \
 DEF:err={rrd1}:rsIfInErrors:AVERAGE \
 AREA:err#E15759:"Input errors" \
 GPRINT:err:AVERAGE:"Avg  \\: %8.3lf /s" \
 GPRINT:err:MAX:"Max  \\: %8.3lf /s\\n"
