##############################################################################
##
##  RAN-Secure Analytics Platform - graphs for RAN-SECURE-SIM-MIB
##  Data collection: datacollection/ran-secure-sim.xml
##
##############################################################################

reports=ran.node.cpu, \
ran.node.temp, \
ran.node.ues, \
ran.cell.prb, \
ran.cell.rrc, \
ran.cell.ues, \
ran.cell.throughput, \
ran.cell.drop, \
ran.cell.availability

######
###### Node level
######

report.ran.node.cpu.name=RAN Node CPU Load
report.ran.node.cpu.columns=ranNodeCpuLoad
report.ran.node.cpu.type=nodeSnmp
report.ran.node.cpu.command=--title="Baseband CPU Load" \
 --vertical-label="Percent" \
 --lower-limit 0 --upper-limit 100 --rigid \
 DEF:cpu={rrd1}:ranNodeCpuLoad:AVERAGE \
 AREA:cpu#4E79A7:"CPU" \
 GPRINT:cpu:AVERAGE:"Avg  \\: %5.1lf %%" \
 GPRINT:cpu:MIN:"Min  \\: %5.1lf %%" \
 GPRINT:cpu:MAX:"Max  \\: %5.1lf %%\\n"

report.ran.node.temp.name=RAN Node Temperature
report.ran.node.temp.columns=ranNodeTemp
report.ran.node.temp.type=nodeSnmp
report.ran.node.temp.command=--title="Baseband Board Temperature" \
 --vertical-label="Degrees C" \
 DEF:temp={rrd1}:ranNodeTemp:AVERAGE \
 LINE2:temp#E15759:"Temperature" \
 GPRINT:temp:AVERAGE:"Avg  \\: %5.1lf C" \
 GPRINT:temp:MAX:"Max  \\: %5.1lf C\\n"

report.ran.node.ues.name=RAN Node Connected UEs
report.ran.node.ues.columns=ranNodeUEs
report.ran.node.ues.type=nodeSnmp
report.ran.node.ues.command=--title="RRC-Connected UEs (node)" \
 --vertical-label="UEs" \
 DEF:ues={rrd1}:ranNodeUEs:AVERAGE \
 AREA:ues#59A14F:"Connected UEs" \
 GPRINT:ues:AVERAGE:"Avg  \\: %6.0lf" \
 GPRINT:ues:MAX:"Max  \\: %6.0lf\\n"

######
###### Cell level
######

report.ran.cell.prb.name=RAN Cell PRB Utilization
report.ran.cell.prb.columns=ranPrbDlUtil,ranPrbUlUtil
report.ran.cell.prb.type=ranCellEntry
report.ran.cell.prb.command=--title="PRB Utilization - {ranCellName}" \
 --vertical-label="Percent" \
 --lower-limit 0 --upper-limit 100 --rigid \
 DEF:dl={rrd1}:ranPrbDlUtil:AVERAGE \
 DEF:ul={rrd2}:ranPrbUlUtil:AVERAGE \
 LINE2:dl#4E79A7:"DL PRB" \
 GPRINT:dl:AVERAGE:"Avg  \\: %5.1lf %%" \
 GPRINT:dl:MAX:"Max  \\: %5.1lf %%\\n" \
 LINE2:ul#F28E2B:"UL PRB" \
 GPRINT:ul:AVERAGE:"Avg  \\: %5.1lf %%" \
 GPRINT:ul:MAX:"Max  \\: %5.1lf %%\\n" \
 HRULE:80#E15759:"Congestion threshold (80 pct)\\n"

report.ran.cell.rrc.name=RAN Cell RRC Setup Success Rate
report.ran.cell.rrc.columns=ranRrcSuccRate
report.ran.cell.rrc.type=ranCellEntry
report.ran.cell.rrc.command=--title="RRC Setup Success Rate - {ranCellName}" \
 --vertical-label="Percent" \
 DEF:raw={rrd1}:ranRrcSuccRate:AVERAGE \
 CDEF:pct=raw,100,/ \
 LINE2:pct#59A14F:"RRC SR" \
 GPRINT:pct:AVERAGE:"Avg  \\: %6.2lf %%" \
 GPRINT:pct:MIN:"Min  \\: %6.2lf %%\\n" \
 HRULE:99#E15759:"Target (99 pct)\\n"

report.ran.cell.ues.name=RAN Cell Active UEs
report.ran.cell.ues.columns=ranActiveUEs
report.ran.cell.ues.type=ranCellEntry
report.ran.cell.ues.command=--title="Active UEs - {ranCellName}" \
 --vertical-label="UEs" \
 DEF:ues={rrd1}:ranActiveUEs:AVERAGE \
 AREA:ues#76B7B2:"Active UEs" \
 GPRINT:ues:AVERAGE:"Avg  \\: %6.0lf" \
 GPRINT:ues:MAX:"Max  \\: %6.0lf\\n"

report.ran.cell.throughput.name=RAN Cell DL Throughput
report.ran.cell.throughput.columns=ranDlThroughput
report.ran.cell.throughput.type=ranCellEntry
report.ran.cell.throughput.command=--title="DL Throughput - {ranCellName}" \
 --vertical-label="Bits per second" \
 DEF:kbps={rrd1}:ranDlThroughput:AVERAGE \
 CDEF:bps=kbps,1000,* \
 AREA:bps#4E79A7:"DL throughput" \
 GPRINT:bps:AVERAGE:"Avg  \\: %8.2lf %sbps" \
 GPRINT:bps:MAX:"Max  \\: %8.2lf %sbps\\n"

report.ran.cell.drop.name=RAN Cell Drop Rate
report.ran.cell.drop.columns=ranDropRate
report.ran.cell.drop.type=ranCellEntry
report.ran.cell.drop.command=--title="Session Drop Rate - {ranCellName}" \
 --vertical-label="Percent" \
 DEF:raw={rrd1}:ranDropRate:AVERAGE \
 CDEF:pct=raw,100,/ \
 LINE2:pct#E15759:"Drop rate" \
 GPRINT:pct:AVERAGE:"Avg  \\: %6.2lf %%" \
 GPRINT:pct:MAX:"Max  \\: %6.2lf %%\\n" \
 HRULE:0.5#B07AA1:"Target (0.5 pct)\\n"

report.ran.cell.availability.name=RAN Cell Availability
report.ran.cell.availability.columns=ranAvailability
report.ran.cell.availability.type=ranCellEntry
report.ran.cell.availability.command=--title="Cell Availability - {ranCellName}" \
 --vertical-label="Percent" \
 DEF:raw={rrd1}:ranAvailability:AVERAGE \
 CDEF:pct=raw,100,/ \
 LINE2:pct#59A14F:"Availability" \
 GPRINT:pct:AVERAGE:"Avg  \\: %6.2lf %%\\n"
